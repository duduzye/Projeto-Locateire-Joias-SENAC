<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Produtos')}"></head><body>
<div class="app"><aside th:replace="~{fragments/layout :: menu('produtos')}"></aside><main class="content">
 <header th:replace="~{fragments/layout :: topo('Produtos','Gerencie as peças e os detalhes do seu catálogo.')}"></header>
 <div th:replace="~{fragments/layout :: alertas}"></div>
 <section class="panel"><div class="panel-head"><div><div class="eyebrow">CATÁLOGO DE PEÇAS</div><h2>Joias cadastradas</h2></div><a class="btn btn-primary" th:href="@{/produtos/novo}">+ Cadastrar produto</a></div>
 <div class="toolbar"><input class="search" type="search" id="filtroTabela" placeholder="Buscar por nome, SKU ou categoria..." aria-label="Pesquisar produtos"></div>
 <div class="table-scroll"><table id="tabelaFiltravel"><thead><tr><th>SKU</th><th>Produto</th><th>Categoria / Material</th><th class="align-right">Preço</th><th class="align-right">Estoque</th><th>Status</th><th>Ações</th></tr></thead><tbody>
 <tr th:each="p:${produtos}"><td class="mono" th:text="${p.A05_sku}"></td><td><strong th:text="${p.A05_nome}"></strong><small th:text="${p.A05_descricao}"></small></td><td th:text="${p.categoria + ' · ' + p.material}"></td><td class="align-right value" th:text="${'R$ ' + #numbers.formatDecimal(p.A05_preco,1,'POINT',2,'COMMA')}"></td><td class="align-right" th:text="${p.A05_quantidade_estoque}"></td><td><span class="tag" th:classappend="${p.A05_ativo} ? 'active' : 'inactive'" th:text="${p.A05_ativo} ? 'Ativo' : 'Inativo'"></span></td><td><div class="actions"><a class="small-link" th:href="@{/produtos/{id}/editar(id=${p.A05_codigo})}">Editar</a><form th:if="${p.A05_ativo}" th:action="@{/produtos/{id}/desativar(id=${p.A05_codigo})}" method="post" onsubmit="return confirm('Desativar este produto?')"><button class="link-danger" type="submit">Desativar</button></form></div></td></tr>
 <tr th:if="${#lists.isEmpty(produtos)}"><td colspan="7" class="empty">Nenhuma joia cadastrada.</td></tr></tbody></table></div></section>
</main></div><script th:src="@{/js/tabelas.js}"></script></body></html>
