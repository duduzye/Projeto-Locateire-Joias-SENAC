<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title th:text="${titulo} + ' | Locateire'">Locateire</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<aside class="sidebar" th:fragment="menu(ativo)">
    <a class="brand" th:href="@{/dashboard}"><span>LOCATAIRE <small>JOIAS E SEMIJOIAS</small></span></a>
    <div class="sidebar-label">ADMINISTRAÇÃO</div>

    <nav class="side-menu" aria-label="Menu principal">
        <a th:classappend="${ativo=='dashboard'}?'selected'" th:href="@{/dashboard}"><span>◫</span> Visão geral</a>

        <!-- ABA SANFONADA: CADASTROS (incluindo Vendas aqui dentro) -->
        <div class="menu-dropdown" th:classappend="${ativo=='produtos' or ativo=='clientes' or ativo=='estoque' or ativo=='fornecedores' or ativo=='vendas'} ? 'open'">
            <button type="button" class="dropdown-btn" onclick="this.parentElement.classList.toggle('open')">
                <span class="icon">!</span>
                <span class="text">Cadastros</span>
                <span class="arrow">▾</span>
            </button>
            <div class="submenu-items">
                <a th:classappend="${ativo=='produtos'}?'selected'" th:href="@{/produtos}"><span>◇</span> Produtos</a>
                <a th:classappend="${ativo=='clientes'}?'selected'" th:href="@{/clientes}"><span>♧</span> Clientes</a>
                <a th:classappend="${ativo=='estoque'}?'selected'" th:href="@{/estoque}"><span>▣</span> Estoque</a>
                <a th:classappend="${ativo=='fornecedores'}?'selected'" th:href="@{/fornecedores}"><span>❖</span> Fornecedores</a>
                <a th:classappend="${ativo=='vendas'}?'selected'" th:href="@{/vendas}"><span>▤</span> Vendas</a>
            </div>
        </div>

    </nav>

    <div class="sidebar-bottom">
        <a class="small-link" th:href="@{/conta}">⚙ Conta da proprietária</a>
        <form th:action="@{/sair}" method="post"><button class="logout" type="submit">Sair do sistema →</button></form>
    </div>
</aside>

<header th:fragment="topo(titulo,subtitulo)" class="page-top">
    <div>
        <h1 th:text="${titulo}">Página</h1>
        <p class="subtitle" th:text="${subtitulo}">Descrição</p>
    </div>
    <span class="owner-pill">✦ Acesso da dona</span>
</header>

<div th:fragment="alertas" class="alerts">
    <div class="alert success" th:if="${sucesso}" th:text="${sucesso}">Sucesso</div>
    <div class="alert error" th:if="${erro}" th:text="${erro}">Erro</div>
</div>
</body></html>
